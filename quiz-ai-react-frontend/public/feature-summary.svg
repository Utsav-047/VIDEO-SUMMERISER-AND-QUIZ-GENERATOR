<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="highlight-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="card-shadow-2" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <pattern id="grid-pattern-2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg-grad-2)" />
  <rect width="800" height="420" fill="url(#grid-pattern-2)" />

  <!-- Soft ambient glow -->
  <circle cx="400" cy="210" r="220" fill="#e0e7ff" opacity="0.45" filter="blur(40px)" />

  <!-- Main Document Floating Card -->
  <g filter="url(#card-shadow-2)">
    <!-- Document Card Frame -->
    <rect x="70" y="38" width="660" height="344" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Document Header Bar -->
    <rect x="70" y="38" width="660" height="48" rx="14" fill="#f8fafc" />
    <path d="M 70 86 L 730 86" stroke="#e2e8f0" stroke-width="1" />

    <!-- File Icon + Document Title -->
    <rect x="92" y="52" width="22" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <path d="M 98 58 L 108 58 M 98 63 L 105 63 M 98 68 L 107 68" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />

    <text x="124" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a">
      Executive Synthesis: Principles of Deep Machine Learning
    </text>

    <!-- Header Badges -->
    <rect x="530" y="51" width="85" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="542" y="66" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#475569">⏱ 3 Min Read</text>

    <rect x="622" y="51" width="94" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="632" y="66" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">✓ Verified AI</text>

    <!-- Document Content Body -->
    <!-- Section 1: Executive Brief / Key Takeaways -->
    <g transform="translate(94, 102)">
      <!-- Section Tag -->
      <rect x="0" y="0" width="136" height="20" rx="4" fill="#eff6ff" />
      <text x="8" y="14" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#1d4ed8" letter-spacing="0.6">
        EXECUTIVE TAKEAWAYS
      </text>

      <!-- Takeaway Item 1 -->
      <g transform="translate(0, 32)">
        <circle cx="6" cy="6" r="3" fill="#2563eb" />
        <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Gradient Backpropagation with Residual Skip Connections
        </text>
        <text x="18" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">
          Eliminates vanishing gradients across 100+ layer architectures, stabilizing learning convergence.
        </text>
      </g>

      <!-- Takeaway Item 2 -->
      <g transform="translate(0, 72)">
        <circle cx="6" cy="6" r="3" fill="#2563eb" />
        <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Multi-Head Attention vs Convolutional Filters
        </text>
        <text x="18" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">
          Allows dynamic global context weighting across arbitrary sequence lengths in parallel.
        </text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="94" y1="216" x2="710" y2="216" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Section 2: Core Concepts & Glossary Pills -->
    <g transform="translate(94, 230)">
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569" letter-spacing="0.6">
        INDEXED KEY CONCEPTS &amp; TIMESTAMPS
      </text>

      <!-- 3 Structured Cards for Concepts -->
      <g transform="translate(0, 26)">
        <!-- Concept 1 -->
        <rect x="0" y="0" width="194" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Transformer Attention</text>
        <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">O(N²) quadratic scaling</text>
        <rect x="12" y="47" width="54" height="15" rx="3" fill="#e0f2fe" />
        <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0284c7">@ 04:12</text>

        <!-- Concept 2 -->
        <rect x="210" y="0" width="194" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="222" y="22" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Residual Connections</text>
        <text x="222" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Identity mapping identity</text>
        <rect x="222" y="47" width="54" height="15" rx="3" fill="#e0f2fe" />
        <text x="226" y="58" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0284c7">@ 09:45</text>

        <!-- Concept 3 -->
        <rect x="420" y="0" width="196" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="432" y="22" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Layer Normalization</text>
        <text x="432" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Pre-LN vs Post-LN stability</text>
        <rect x="432" y="47" width="54" height="15" rx="3" fill="#e0f2fe" />
        <text x="436" y="58" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0284c7">@ 15:30</text>
      </g>

      <!-- Bottom Status Row -->
      <g transform="translate(0, 106)">
        <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
          Formats Available: Executive Summary • Bullet Points • Deep Dive Study Notes • PDF
        </text>
      </g>
    </g>
  </g>
</svg>
