<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="score-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="card-shadow-3" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <pattern id="grid-pattern-3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg-grad-3)" />
  <rect width="800" height="420" fill="url(#grid-pattern-3)" />

  <!-- Ambient glow -->
  <circle cx="400" cy="210" r="220" fill="#d1fae5" opacity="0.35" filter="blur(40px)" />

  <!-- Main Quiz Floating Card -->
  <g filter="url(#card-shadow-3)">
    <!-- Main Card Frame -->
    <rect x="70" y="38" width="660" height="344" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Quiz Header Bar -->
    <rect x="70" y="38" width="660" height="48" rx="14" fill="#f8fafc" />
    <path d="M 70 86 L 730 86" stroke="#e2e8f0" stroke-width="1" />

    <!-- Question Indicator & Difficulty Tag -->
    <text x="94" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a">
      QUESTION 2 OF 5
    </text>

    <!-- Difficulty Badge (Medium) -->
    <rect x="230" y="52" width="76" height="20" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="240" y="66" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#b45309">MEDIUM</text>

    <!-- Timer & Score Meter on the right -->
    <rect x="520" y="51" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="532" y="66" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#475569">⏱ 02:45 Left</text>

    <rect x="620" y="51" width="96" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="632" y="66" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#047857">Score: 100%</text>

    <!-- Quiz Body Content -->
    <!-- The Question -->
    <g transform="translate(94, 102)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">
        What mechanism prevents gradient vanishing across deep residual networks?
      </text>

      <!-- MCQ Option A (Normal / Unselected) -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="450" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="19" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="17" y="23" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#64748b">A</text>
        <text x="38" y="23" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#334155">
          Multiplexed Dropout Layer Randomization
        </text>
      </g>

      <!-- MCQ Option B (Selected & Correct!) -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="450" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
        <!-- Green Selected Radio -->
        <circle cx="20" cy="19" r="8" fill="#10b981" />
        <path d="M 16 19 L 19 22 L 24 16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#166534">
          Identity Skip Connections [F(x) + x]
        </text>
        <rect x="360" y="9" width="80" height="20" rx="4" fill="#dcfce7" />
        <text x="368" y="23" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#15803d">✓ CORRECT</text>
      </g>

      <!-- MCQ Option C (Normal / Unselected) -->
      <g transform="translate(0, 124)">
        <rect x="0" y="0" width="450" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="19" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="17" y="23" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#64748b">C</text>
        <text x="38" y="23" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#334155">
          Linear Sigmoid Compression Units
        </text>
      </g>

      <!-- Explanation Callout Bar below options -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="612" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <!-- Info bulb icon -->
        <circle cx="20" cy="24" r="10" fill="#eff6ff" />
        <text x="16" y="28" font-size="11">💡</text>
        <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">
          Instant Explanation &amp; Timestamp Reference:
        </text>
        <text x="38" y="36" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#475569">
          Skip connections let identity gradients flow unimpeded directly back through layers (Ref: 09:45).
        </text>
      </g>
    </g>

    <!-- Right Side: Mini Mastery Progress Card -->
    <g transform="translate(560, 134)">
      <rect x="0" y="0" width="146" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Laurel / Medal Icon Circle -->
      <circle cx="73" cy="40" r="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <path d="M 65 40 L 71 46 L 82 34" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <text x="73" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#065f46">
        100% Mastery
      </text>
      <text x="73" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#059669">
        Grade: Exemplary
      </text>
      <text x="73" y="114" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">
        Saved to Profile
      </text>
    </g>
  </g>
</svg>
